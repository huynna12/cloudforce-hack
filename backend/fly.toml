# fly.toml app configuration file generated for heidi-be on 2026-05-11T17:01:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heidi-be'
primary_region = 'iad'

[build]

[env]
  SESSIONS_FILE = '/data/sessions_store.json'

[[mounts]]
  source = 'heidi_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
